<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <rect width="1200" height="630" fill="#050505"/>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1" fill="rgba(255,255,255,.06)"/>
    </pattern>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="30%" stop-color="#f5f0eb"/>
      <stop offset="100%" stop-color="rgba(245,240,235,.55)"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity=".05"/>
  <text x="80" y="88" font-family="ui-monospace,monospace" font-size="28" fill="rgba(245,240,235,.5)" letter-spacing="-1">Over</text>
  <text x="80" y="300" font-family="system-ui,-apple-system,sans-serif" font-size="170" font-weight="200" fill="#f5f0eb" letter-spacing="-4">Código,</text>
  <text x="80" y="450" font-family="system-ui,-apple-system,sans-serif" font-size="168" font-weight="800" fill="url(#gg)" letter-spacing="-5">segurança</text>
  <text x="80" y="590" font-family="system-ui,-apple-system,sans-serif" font-size="126" font-weight="800" fill="none" stroke="#f5f0eb" stroke-width="2" letter-spacing="-3">&amp; automação.</text>
</svg>
